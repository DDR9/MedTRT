name: MedTRT Verification CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  cpu-unit-and-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pandas nibabel monai pytest pyyaml matplotlib plotly streamlit onnx onnxruntime

      - name: Syntax & static compilation check
        run: |
          python -m py_compile src/medtrt/*.py app/viewer.py app/workstation.py benchmarks/*.py tests/*.py

      - name: Run CPU-compatible unit tests & published claims / telemetry verification
        env:
          PYTHONPATH: src
        run: |
          python -m medtrt.verify_claims
          pytest tests/test_volume_math.py tests/test_metrics.py tests/test_failure_handling.py tests/test_workstation.py tests/test_published_results.py tests/test_dashboard.py -v
