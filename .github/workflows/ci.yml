name: MedTRT Verification CI

on:
  push:
    branches: [ main, feature/medtrt-engineering-validation ]
  pull_request:
    branches: [ main ]

jobs:
  cpu-unit-and-static-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medtrt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy nibabel monai pytest pyyaml torch --index-url https://download.pytorch.org/whl/cpu

      - name: Syntax & static compilation check
        run: |
          python -m py_compile src/medtrt/*.py app/viewer.py benchmarks/*.py tests/*.py

      - name: Run CPU-compatible unit tests (volumetry & segmentation metrics)
        env:
          PYTHONPATH: src
        run: |
          pytest tests/test_volume_math.py -v
