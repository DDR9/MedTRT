[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medtrt"
version = "0.2.0"
description = "MedTRT: GPU-Accelerated 3D CT Segmentation, Profiled and Validated on NVIDIA Blackwell"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "monai>=1.4.0",
    "nibabel>=5.2.0",
    "SimpleITK>=2.3.0",
    "scipy>=1.12.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "tensorrt-cu12>=10.16,<11",
    "streamlit>=1.38.0",
    "plotly>=5.22.0",
    "matplotlib>=3.8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
